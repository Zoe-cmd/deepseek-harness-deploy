# DSH auth gateway — standalone nginx for the Docker Compose setup.
# Mounted as /etc/nginx/nginx.conf in the dsh-nginx container (network_mode: host).
# Layout: Browser -> nginx(:80/:443) -> auth gateway(127.0.0.1:3081) -> harness(127.0.0.1:3080)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  access_log /var/log/nginx/access.log;

  # WebSocket: only send Connection: upgrade when the client asked for it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream dsh_auth_gateway {
    server 127.0.0.1:3081;
  }

  server {
    listen 80;
    server_name dsh.example.com;   # <- replace with your Harness domain
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;                 # <- or your Harness domain / server IP

    ssl_certificate     /etc/nginx/certs/harness.crt;
    ssl_certificate_key /etc/nginx/certs/harness.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://dsh_auth_gateway;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }
}