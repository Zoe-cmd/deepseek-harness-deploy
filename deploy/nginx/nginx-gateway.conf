# =============================================================
# DSH auth gateway — PRODUCTION nginx site (system nginx).
#
# Install: copy to /etc/nginx/conf.d/harness-gateway.conf
#          nginx -t && systemctl reload nginx  (or: nginx -s reload)
#
# Network layout (only these two ports are public):
#   :443  HTTPS  -> auth gateway (127.0.0.1:3081) -> harness (127.0.0.1:3080)
#   :80   HTTP   -> 301 redirect to HTTPS (harness hostname only)
#
# The Harness itself NEVER binds a public interface; it stays on loopback.
# =============================================================

# WebSocket: only send Connection: upgrade when the client asked for it.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream dsh_auth_gateway {
  server 127.0.0.1:3081;
}

# ---- plain HTTP: redirect to HTTPS ----------------------------------------
# server_name must be the public hostname of the Harness site. If you only
# have an IP and another vhost owns that IP on :80, use the domain name here.
server {
  listen 80;
  server_name dsh.example.com;   # <- replace with your Harness domain

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- HTTPS: the only public face of DeepSeek Harness ----------------------
server {
  listen 443 ssl;
  server_name _;                 # <- or your Harness domain / server IP

  ssl_certificate     /etc/nginx/certs/harness.crt;
  ssl_certificate_key /etc/nginx/certs/harness.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # HSTS: only enable once a real CA certificate is in place.
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://dsh_auth_gateway;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade support (Harness /api/events.* downlinks)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}