# =============================================================
# DSH auth gateway — standalone TEST nginx instance.
# Runs on 8080 (HTTP) and 8443 (HTTPS, self-signed) so the public
# system nginx on :80/:443 is left untouched. For production use
# nginx-gateway.conf instead.
#
# Usage (paths are relative to the deploy dir via `-p`):
#   nginx -p $ROOT/deploy -c nginx/nginx-gateway-test.conf
#   nginx -p $ROOT/deploy -s stop -c nginx/nginx-gateway-test.conf

worker_processes 1;
pid run/nginx-test.pid;
error_log logs/nginx-test-error.log;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  access_log logs/nginx-test-access.log;
  client_max_body_size 100m;

  # WebSocket: only send Connection: upgrade when the client asked for it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream dsh_auth_gateway {
    server 127.0.0.1:3081;
  }

  # ---- plain HTTP: redirect to HTTPS ------------------------------------
  server {
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
  }

  # ---- HTTPS: the only public face of DeepSeek Harness -------------------
  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     ../certs/harness.crt;
    ssl_certificate_key ../certs/harness.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://dsh_auth_gateway;
      proxy_http_version 1.1;

      # The gateway forwards the ORIGINAL Host header upstream; the browser
      # trust fence is satisfied because the gateway rewrites it to loopback.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket upgrade support (Harness /api/events.* downlinks)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }
}